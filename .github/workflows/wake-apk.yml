# Builds an installable APK with 语音唤醒 on a stock ubuntu-latest runner: the same
# x86_64 Linux the build chain assumes (tooling/setup-toolchain.sh downloads a linux
# JDK and a linux Flutter; runtime/build-runtime.sh unpacks an Ubuntu base).
#
#   Actions -> Wake APK -> Run workflow   (arm64 = a phone, x64 = an emulator)
#
# Two things this job owns that a local build does not: a keystore, because a CI
# runner has none and every APK must be signed to install, and the pinned NDK that
# libtawcroot.so needs (28.2.13676358), which is not always Flutter's default.
#
# The first run is the slow one: toolchain ~20-40 min, the bundled runtime ~15-30.
# Both are cached and saved as soon as they are ready, so a run that later hits the
# 60-minute timeout still makes the next one fast.
name: Wake APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'runtime/**'
      - 'tooling/**'
      - '.github/workflows/wake-apk.yml'
  workflow_dispatch:
    inputs:
      flavor:
        description: 'arm64 (a phone) or x64 (an emulator)'
        type: choice
        options: [arm64, x64]
        default: arm64

permissions:
  contents: write

concurrency:
  group: wake-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build the APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FLAVOR: ${{ github.event.inputs.flavor || 'arm64' }}
    steps:
      # This repository holds only the patch and this workflow; the sources come
      # straight from the upstream repository, then the patch is applied on top.
      # The runner image arrives with the disk essentially full: the runtime build
      # then dies at "assembling rootfs" with no error. These are the extras the
      # image ships for other languages, none of which an APK build needs.
      - name: Free disk space
        run: |
          set -eu
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/local/graalvm /opt/az /usr/lib/jvm || true
          sudo apt-get clean || true
          df -h / | tail -1

      - name: Check out the upstream sources
        uses: actions/checkout@v4
        with:
          repository: ccch1mneyyy/dsh-go
          ref: 6db08d2e2faafec2db8597587d424c2165196dad
          persist-credentials: false

      - name: Check out the patch
        uses: actions/checkout@v4
        with:
          path: .patchsrc
          persist-credentials: false

      - name: Apply the wake-word patch
        run: |
          set -eu
          git config user.email "ci@local"
          git config user.name "wake-ci"
          git am --3way .patchsrc/dsh-go-wake.patch
          # Follow-ups found once the tree actually compiled.
          if [ -f .patchsrc/dsh-go-wake-fixup.patch ]; then
            git am --3way .patchsrc/dsh-go-wake-fixup.patch
          fi
          # The wake gate: a floor learned from silence kept it open, so the recognizer
          # decoded a room into 呵呵 and the wake word never matched.
          if [ -f .patchsrc/dsh-go-wake-gate.patch ]; then
            git am --3way .patchsrc/dsh-go-wake-gate.patch
          fi
          # The audio the recognizer is handed, and a sample of it to listen to.
          if [ -f .patchsrc/dsh-go-wake-audio.patch ]; then
            git am --3way .patchsrc/dsh-go-wake-audio.patch
          fi
          git log --oneline -4

      # Keyed on the installer itself: when it changes, its downloads are rebuilt.
      # setup-toolchain.sh defaults DEV_ROOT to $HOME/dev, so that is what is cached.
      - name: Restore the toolchain
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/dev
            ~/.pub-cache
          key: dsh-toolchain-v1-${{ runner.os }}-${{ hashFiles('tooling/setup-toolchain.sh') }}
          restore-keys: dsh-toolchain-v1-${{ runner.os }}-

      # This job only builds an APK, so the emulator and its 1.5 GB system image
      # are skipped, and the downloads come from the upstream sources rather than
      # the China mirrors the script defaults to: a runner in the US reaches
      # storage.googleapis.com far faster than storage.flutter-io.cn.
      - name: Trim the toolchain to what an APK needs, and use upstream mirrors
        run: |
          set -eu
          sed -i 's/ "emulator" \$SYSTEM_IMAGE//' tooling/setup-toolchain.sh
          sed -i 's#https://storage.flutter-io.cn/flutter_infra_release/releases#https://storage.googleapis.com/flutter_infra_release/releases#' tooling/setup-toolchain.sh
          # runtime/build-runtime.sh defaults to the Tsinghua mirror and npmmirror; a
          # runner in the US downloads the same pinned bytes from the official hosts.
          sed -i \
            -e 's#https://mirrors.tuna.tsinghua.edu.cn/ubuntu-cdimage/#https://cdimage.ubuntu.com/#' \
            -e 's#https://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports#http://ports.ubuntu.com/ubuntu-ports#' \
            -e 's#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#http://archive.ubuntu.com/ubuntu#' \
            -e 's#https://npmmirror.com/mirrors/node#https://nodejs.org/dist#' \
            -e 's#https://registry.npmmirror.com/-/binary/python-build-standalone#https://github.com/astral-sh/python-build-standalone/releases/download#' \
            -e 's#https://registry.npmmirror.com#https://registry.npmjs.org#' \
            runtime/build-runtime.sh
          grep -nE 'UBUNTU_MIRROR=|NODE_MIRROR=|NPM_REGISTRY=' runtime/build-runtime.sh
          grep -n 'sdkmanager --sdk_root' -A2 tooling/setup-toolchain.sh | head -5
          grep -n 'storage.googleapis.com' tooling/setup-toolchain.sh

      - name: Install the toolchain (JDK 17, Flutter, Android SDK)
        run: bash tooling/setup-toolchain.sh

      # Saved right after it is ready: a later timeout then costs nothing twice.
      - name: Save the toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/dev
            ~/.pub-cache
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      # libtawcroot.so is compiled by runtime/tawcroot/build.py against the NDK that
      # runtime/tawcroot/source.json pins, which is not necessarily flutter.ndkVersion.
      - name: Add the NDK libtawcroot.so is pinned to
        run: |
          set -eu
          source tooling/env.sh
          pinned=$(python3 -c 'import json; print(json.load(open("runtime/tawcroot/source.json"))["ndkVersion"])')
          # `yes |` ends when sdkmanager stops reading, which is not a failure.
          yes | sdkmanager --sdk_root="$ANDROID_HOME" "ndk;$pinned" > /dev/null || true
          test -d "$ANDROID_HOME/ndk/$pinned"

      # A later step runs in a fresh shell, so the toolchain is handed over expanded:
      # tooling/env.sh assigns from $DEV_ROOT, which would land in $GITHUB_ENV as text.
      # The China mirrors env.sh sets are deliberately not passed on; the runner
      # reaches pub.dev and the Flutter CDN directly.
      - name: Hand the toolchain to the build steps
        run: |
          set -eu
          source tooling/env.sh
          # runtime/tawcroot/build.py looks at ANDROID_NDK_HOME first, then falls back
          # to <ANDROID_HOME>/ndk; pin it so the cleanup above cannot redirect it to
          # the runner image's own SDK.
          pinned=$(python3 -c 'import json; print(json.load(open("runtime/tawcroot/source.json"))["ndkVersion"])')
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$pinned" >> "$GITHUB_ENV"
          echo "NDK pinned at $ANDROID_HOME/ndk/$pinned" >> "$GITHUB_STEP_SUMMARY"
          # tooling/env.sh points these at the China mirrors, which a US runner
          # reaches slowly; the official hosts are the ones it is close to.
          {
            echo "PUB_HOSTED_URL=https://pub.dev"
            echo "FLUTTER_STORAGE_BASE_URL=https://storage.googleapis.com"
            echo "JAVA_HOME=$JAVA_HOME"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "PATH=$PATH"
          } >> "$GITHUB_ENV"
          {
            echo '### Toolchain'
            echo '```'
            java -version 2>&1 | head -n 2 || true
            flutter --version 2>&1 | head -n 2 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The runner has no key, so one is made here: app/android/key.properties is
      # gitignored (*.jks too), and build.gradle.kts picks the release key up from it
      # and signs all three schemes with it.
      - name: Make a keystore and let Gradle sign with it
        run: |
          set -eu
          keystore="$GITHUB_WORKSPACE/app/android/wake-ci.jks"
          keytool -genkeypair -noprompt \
            -keystore "$keystore" -storetype PKCS12 \
            -storepass dshpass -keypass dshpass \
            -alias dshgo -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=dsh-go-wake, OU=CI, O=dsh-go, C=CN"
          printf 'storeFile=%s\nstorePassword=dshpass\nkeyAlias=dshgo\nkeyPassword=dshpass\n' \
            "$keystore" > app/android/key.properties

      - name: Restore the runtime downloads
        id: runtime
        uses: actions/cache/restore@v4
        with:
          path: runtime/.cache
          key: runtime-downloads-v1-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**') }}
          restore-keys: runtime-downloads-v1-

      # The built runtime (Ubuntu rootfs + Node + DSH, packed into the APK) is what makes a
      # run long: rebuilt every time, ~15 of the ~33 minutes. build-wake-apk.sh already
      # skips rebuilding when runtime/out/<abi>/assets/runtime/manifest.json is there, so
      # the exact directory is cached on the inputs it is built from. No restore-keys: a
      # near miss would hand the build a runtime from other sources, which is worse than
      # paying for a rebuild.
      - name: Restore the built runtime
        id: runtime-out
        uses: actions/cache/restore@v4
        with:
          path: runtime/out
          key: runtime-out-v2-${{ runner.os }}-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**', 'runtime/tawcroot/**', 'tooling/setup-toolchain.sh') }}

      # pub get -> l10n (gen-l10n, the new strings) -> runtime/out/$abi -> the APK.
      - name: What the runner has to work with
        run: |
          df -h / /tmp
          free -m
          nproc

      # continue-on-error so the step below always gets to report what happened,
      # even when the build dies instead of exiting with a status.
      - name: Build the runtime and the APK
        id: build
        continue-on-error: true
        env:
          XZ_THREADS: "2"
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          : > /tmp/wake-build.log
          # A runner that dies mid-step never runs the cleanup below, so the log is
          # pushed to the repository while the build runs; whatever was written last
          # survives.
          (
            while true; do
              sleep 20
              [ -s /tmp/wake-build.log ] || continue
              { echo "== resources =="; df -h / | tail -1; free -m | head -2;
                echo "== tail =="; tail -c 50000 /tmp/wake-build.log; } > /tmp/tail.txt
              content=$(base64 -w0 /tmp/tail.txt)
              sha=$(curl -sS -H "Authorization: Bearer $TOKEN" \
                     "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/build-log.txt" \
                     | tr ',' '\n' | grep -m1 '"sha"' | cut -d'"' -f4 || true)
              body="{\"message\":\"ci: build log\",\"content\":\"$content\",\"branch\":\"main\""
              [ -n "$sha" ] && body="$body,\"sha\":\"$sha\""
              body="$body}"
              curl -sS -X PUT -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/build-log.txt" \
                -d "$body" > /dev/null || true
            done
          ) &
          WATCH=$!
          bash tooling/build-wake-apk.sh -f "$FLAVOR" 2>&1 | tee -a /tmp/wake-build.log
          status=${PIPESTATUS[0]}
          kill $WATCH 2>/dev/null || true
          echo "build-exit=$status" >> /tmp/wake-build.log
          exit $status

      # Saved only after the APK built, so a cache is never a half-built runtime.
      - name: Save the built runtime
        if: steps.runtime-out.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: runtime/out
          key: ${{ steps.runtime-out.outputs.cache-primary-key }}

      # The run log is not always downloadable from this repository, so the tail is
      # committed instead: build-log.txt is then readable over the contents API.
      - name: Commit the build log
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          df -h / | tail -1
          free -m | head -2
          { echo "== resources =="; df -h / | tail -1; free -m | head -2;
            echo "== tail =="; tail -c 60000 /tmp/wake-build.log 2>/dev/null || echo "no log file"; } > /tmp/tail.txt
          content=$(base64 -w0 /tmp/tail.txt)
          curl -sS -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/build-log.txt" \
            -d "{\"message\":\"ci: build log\",\"content\":\"$content\",\"branch\":\"main\"}" | head -c 300

      - name: Save the runtime downloads
        if: steps.runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: runtime/.cache
          key: ${{ steps.runtime.outputs.cache-primary-key }}

      # Gradle signs with the key above; this reads it back, and signs the APK here
      # if it somehow came out debug-signed (key.properties unread, say).
      - name: Check the signature is the CI key
        run: |
          set -eu
          apksigner=$(ls -1d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          keystore="$GITHUB_WORKSPACE/app/android/wake-ci.jks"
          for apk in app/build/app/outputs/flutter-apk/*.apk; do
            if ! "$apksigner" verify --print-certs "$apk" | grep -q 'CN=dsh-go-wake'; then
              echo "::notice file=$apk::not the CI key; signing it here"
              aligned="${apk%.apk}-aligned.apk"
              "$(dirname "$apksigner")/zipalign" -f -p 4 "$apk" "$aligned"
              "$apksigner" sign --ks "$keystore" --ks-pass pass:dshpass \
                --key-pass pass:dshpass --ks-key-alias dshgo \
                --out "${apk%.apk}-signed.apk" "$aligned"
              mv -f "${apk%.apk}-signed.apk" "$apk"
              rm -f "$aligned"
            fi
            "$apksigner" verify --print-certs "$apk" | grep -q 'CN=dsh-go-wake'
            echo "$(basename "$apk"): $(du -h "$apk" | cut -f1)"
          done

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-wake-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      # Where the APK is, without leaving the run page to find out.
      - name: Say where the APK is
        if: success()
        run: |
          {
            echo '### dsh-go-wake-apk'
            echo ''
            echo 'Actions page -> this run -> Artifacts -> **dsh-go-wake-apk**.'
            echo ''
            echo '| APK | Size | versionCode |'
            echo '|---|---|---|'
            aapt2=$(ls -1d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1) || true
            for apk in app/build/app/outputs/flutter-apk/*.apk; do
              badge=$("$aapt2" dump badging "$apk" 2>/dev/null | sed -n 's/^package:.*versionCode=.\([0-9]*\).*/\1/p') || true
              echo "| $(basename "$apk") | $(du -h "$apk" | cut -f1) | ${badge:-?} |"
            done
            echo ''
            echo 'Self-signed, unlike the official build: uninstall the official DSH Go'
            echo 'first (its local data goes; back it up).'
          } >> "$GITHUB_STEP_SUMMARY"
